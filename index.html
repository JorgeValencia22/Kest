<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEST — Tienda oficial</title>
<meta name="description" content="KEST: tecnología, gadgets y accesorios seleccionados. Precios en pesos chilenos, despacho a todo Chile.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="KEST — Tienda oficial">
<meta property="og:description" content="Tecnología, gadgets y accesorios seleccionados por KEST.">
<meta property="og:image" content="brand/kest-logo.png">
<link rel="icon" href="brand/kest-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--ink:#000;--paper:#fff;--fog:#f3f3f2;--line:#e2e2e0;--mute:#6b6b68;--err:#b00020;--ease:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Archivo,ui-sans-serif,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:88rem;margin-inline:auto;padding-inline:1.25rem}
@media(min-width:768px){.wrap{padding-inline:2.5rem}}
.display{font-weight:600;font-stretch:118%;letter-spacing:-.02em;line-height:1.02;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
h1.display{font-size:clamp(2.25rem,5vw,3.5rem)}
h2.display{font-size:clamp(1.9rem,3.4vw,2.75rem)}
.mt-s{margin-top:2rem}.mt-m{margin-top:4rem}.mt-l{margin-top:7rem}

/* Botones: el relleno invertido entra desde la izquierda */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:0 1.75rem;font-weight:500;font-size:.9375rem;text-decoration:none;
 background:linear-gradient(var(--sw,#fff),var(--sw,#fff)) 0 0/0% 100% no-repeat #000;color:#fff;border:1px solid #000;transition:background-size .6s var(--ease),color .35s var(--ease),opacity .2s,transform .15s var(--ease)}
.btn:hover{background-size:100% 100%;color:#000}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background-color:transparent;--sw:#000;color:#000}.btn.ghost:hover{color:#fff}
.btn.light{--sw:transparent;background-color:#fff;color:#000;border-color:#fff}.btn.light:hover{background-color:transparent;color:#fff}
.btn.block{width:100%}
.link{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s var(--ease);text-decoration:none}
.link:hover{background-size:100% 1px}

/* Cabecera */
header.top{position:sticky;top:0;z-index:40;background:rgb(255 255 255/.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);view-transition-name:site-header}
.top .bar{display:flex;align-items:center;gap:1.5rem;height:4rem}
.top .logo img{height:36px;width:auto}
.top nav{display:none;gap:1.75rem;margin-left:1.5rem;font-size:.875rem}
.top form.s{margin-left:auto;display:none}
.top form.s input{width:14rem;border:0;border-bottom:1px solid var(--line);padding:.5rem 0;font:inherit;background:none;transition:width .3s var(--ease),border-color .2s}
.top form.s input:focus{width:18rem;border-color:#000;outline:none}
.top .right{margin-left:auto;display:flex;align-items:center;gap:.25rem}
.cartlink{display:flex;align-items:center;gap:.5rem;height:2.5rem;padding:0 .5rem;font-size:.875rem;text-decoration:none}
.cartlink b{font-weight:400;min-width:.75rem}.bump{animation:bump .45s var(--ease)}
@keyframes bump{35%{transform:scale(1.5)}}
details.menu summary{list-style:none;display:grid;place-items:center;width:2.5rem;height:2.5rem;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
details.menu summary i{display:block;width:20px;height:1px;background:#000;box-shadow:0 -7px #000,0 7px #000}
.menu-panel{position:fixed;inset:4rem 0 auto 0;background:#fff;border-bottom:1px solid var(--line);padding:1.25rem;animation:menuin .5s var(--ease) both}
.menu-panel form{margin-bottom:1rem}
.menu-panel input{width:100%;min-height:3rem;border:1px solid var(--line);padding:.6rem .875rem;font:inherit}
.menu-panel ul{list-style:none;margin:0;padding:0;font-size:1.125rem}
.menu-panel li{animation:rise .6s var(--ease) both}.menu-panel li:nth-child(2){animation-delay:.08s}.menu-panel li:nth-child(3){animation-delay:.14s}.menu-panel li:nth-child(4){animation-delay:.2s}.menu-panel li:nth-child(5){animation-delay:.26s}.menu-panel li:nth-child(6){animation-delay:.32s}
.menu-panel a{display:block;padding:.5rem 0;text-decoration:none}
@keyframes menuin{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0)}}
@media(min-width:1024px){.top nav{display:flex}details.menu{display:none}}
@media(min-width:768px){.top form.s{display:block}.top .right{margin-left:0}}

/* Imágenes redondeadas */
.pimg{position:relative;overflow:hidden;border-radius:16px;background:var(--fog);aspect-ratio:4/5}
.pimg.sq{aspect-ratio:1}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:imgin 1s var(--ease) both}
.pimg .ph{position:absolute;inset:0;display:grid;place-items:center;font:600 3.5rem/1 Archivo,sans-serif;font-stretch:125%;color:rgb(0 0 0/.12)}
@keyframes imgin{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}

/* Tarjetas */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2.5rem 1rem}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr);gap:2.5rem 1.5rem}}
.card{display:block;text-decoration:none}
.card .frame{position:relative;overflow:hidden;border-radius:16px}
.card .frame .pimg{transition:transform .7s var(--ease)}.card:hover .frame .pimg{transform:scale(1.04)}
.card h3{margin:.75rem 0 0;font-size:15px;font-weight:500;line-height:1.35}
.card p{margin:.25rem 0 0;display:flex;gap:.5rem}
.tags{position:absolute;left:.5rem;top:.5rem;z-index:2;display:flex;gap:.25rem;flex-wrap:wrap}
.tag{background:#fff;color:#000;padding:.3rem .5rem;font-size:11px;font-weight:500;line-height:1}.tag.solid{background:#000;color:#fff}

/* Portada */
.hero{position:relative;isolation:isolate;overflow:hidden;background:#000;color:#fff}
.hero .in{position:relative;min-height:78svh;display:flex;flex-direction:column;justify-content:flex-end;padding:8rem 0 4rem}
.hero .big{position:absolute;right:.5rem;top:-1.5rem;font-size:34vw;font-weight:600;font-stretch:125%;letter-spacing:-.05em;line-height:1;color:rgb(255 255 255/.07);user-select:none;pointer-events:none}
.hero h1{max-width:56rem;font-size:clamp(2.5rem,7.5vw,6.5rem)}
.hero p{max-width:28rem;font-size:1.125rem;color:rgb(255 255 255/.75);margin:1.5rem 0 0}
.hero .cta{margin-top:2.5rem}
.rise{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--intro,0s))}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
html[data-intro="on"]{--intro:2.7s}

/* Categorías, beneficios */
.cats{list-style:none;margin:2rem 0 0;padding:0;display:grid;border-top:1px solid #000}
@media(min-width:640px){.cats{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.cats{grid-template-columns:repeat(4,1fr)}}
.cats a{display:flex;flex-direction:column;justify-content:space-between;min-height:10rem;padding:1.25rem;text-decoration:none;border-bottom:1px solid var(--line);transition:background .4s var(--ease),color .4s var(--ease)}
.cats a:hover{background:#000;color:#fff}.cats a span:first-child{font-size:1.25rem;font-weight:500}.cats a span:last-child{font-size:.875rem;color:var(--mute)}.cats a:hover span:last-child{color:rgb(255 255 255/.7)}
.ben{display:grid;gap:1px;background:var(--line)}@media(min-width:640px){.ben{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.ben{grid-template-columns:repeat(4,1fr)}}
.ben div{background:#fff;padding:1.5rem 1.5rem 1.5rem 0}.ben b{font-weight:500}.ben p{margin:.25rem 0 0;font-size:.875rem;color:var(--mute)}
.two{display:grid;gap:2.5rem}@media(min-width:768px){.two{grid-template-columns:1fr 1fr;gap:5rem}}
.cta-box{background:var(--fog);padding:2rem;display:grid;gap:2rem;align-items:end}@media(min-width:768px){.cta-box{grid-template-columns:1fr 1fr;padding:3.5rem}}
.row{display:flex;align-items:end;justify-content:space-between;gap:1rem}

/* Catálogo */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0 0}
.chip{border:1px solid var(--line);padding:.55rem 1rem;font-size:.875rem;text-decoration:none;transition:background .3s,color .3s,border-color .3s}
.chip:hover,.chip.on{background:#000;color:#fff;border-color:#000}
.tools{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-top:1.5rem}
select,.in-f{min-height:2.75rem;border:1px solid var(--line);background:#fff;padding:.5rem .75rem;font:inherit;border-radius:0}
.empty{padding:4rem 0;text-align:center;color:var(--mute)}

/* Ficha */
.crumbs{font-size:.875rem;color:var(--mute);margin:1.5rem 0}
.pd{display:grid;gap:2rem}@media(min-width:1024px){.pd{grid-template-columns:1fr 1fr;gap:4rem}}
.zoom{display:block;width:100%;cursor:zoom-in}
.thumbs{list-style:none;margin:.75rem 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.thumbs button{display:block;width:100%;opacity:.5;outline:1px solid transparent;outline-offset:3px;border-radius:12px;transition:opacity .4s var(--ease),outline-color .4s,transform .5s var(--ease)}
.thumbs button:hover{opacity:.85;transform:translateY(-2px)}.thumbs button.on{opacity:1;outline-color:#000}
.price{font-size:1.5rem;display:flex;gap:.75rem;align-items:baseline;margin:1rem 0 0}.price s{font-size:1rem;color:var(--mute)}
.opts{margin-top:1.5rem;border:0;padding:0}.opts legend{font-size:.8125rem;color:var(--mute);margin-bottom:.5rem;padding:0}
.opts .o{display:flex;flex-wrap:wrap;gap:.5rem}
.opt{min-height:2.75rem;border:1px solid var(--line);padding:0 1.25rem;font-size:.875rem;transition:background .25s,color .25s,border-color .25s}.opt:hover{border-color:#000}.opt[aria-pressed=true]{background:#000;color:#fff;border-color:#000}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line)}.qty button{width:3rem;height:3rem;font-size:1.125rem}.qty output{width:2.5rem;text-align:center}
.spec{margin:2rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.5rem 2rem;font-size:.9rem}.spec dt{color:var(--mute)}.spec dd{margin:0}
.note{margin-top:1.5rem;border-top:1px solid var(--line);padding-top:1rem;font-size:.875rem;color:var(--mute)}
.err{color:var(--err);font-size:.8125rem}.fade{animation:fade .35s var(--ease) both}
@keyframes fade{from{opacity:0}}

/* Carrito */
.cart{display:grid;gap:3rem}@media(min-width:1024px){.cart{grid-template-columns:1.5fr 1fr}}
.line{display:grid;grid-template-columns:5.5rem 1fr auto;gap:1rem;padding:1.25rem 0;border-bottom:1px solid var(--line);animation:fade .4s var(--ease) both}
.line .pimg{border-radius:12px}.line h3{margin:0;font-size:.95rem;font-weight:500}.line small{color:var(--mute)}
.line .rm{font-size:.8125rem;color:var(--mute);text-decoration:underline}
.sum{background:var(--fog);padding:1.5rem;align-self:start;display:grid;gap:.75rem}
.sum .t{display:flex;justify-content:space-between}.sum .tot{font-size:1.25rem;font-weight:600;border-top:1px solid var(--line);padding-top:.75rem}
.fld{display:grid;gap:.35rem}.fld label{font-size:.8125rem;color:var(--mute)}.fld input,.fld select{width:100%;min-height:3rem;border:1px solid var(--line);padding:.6rem .875rem;font:inherit;background:#fff;transition:border-color .15s;border-radius:0}.fld input:focus,.fld select:focus{border-color:#000;outline:none}

/* Texto largo */
.doc{max-width:48rem}.doc h2{margin:2.5rem 0 0;font-size:.875rem;font-weight:600;letter-spacing:.14em}.doc p{margin:.4rem 0 0;color:var(--mute)}
details.faq{border-bottom:1px solid var(--line)}details.faq summary{padding:1.1rem 0;cursor:pointer;font-weight:500}details.faq p{margin:0 0 1.1rem;color:var(--mute)}

/* Pie */
footer.foot{margin-top:7rem;background:#000;color:#fff;padding:4rem 0 2rem}
.foot .cols{display:grid;gap:2.5rem}@media(min-width:768px){.foot .cols{grid-template-columns:2fr 1fr 1fr 1fr}}
.foot h2{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:rgb(255 255 255/.55);margin:0 0 1rem;font-weight:500}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem;font-size:.9rem}.foot a{text-decoration:none}
.foot .legal{margin-top:3rem;border-top:1px solid rgb(255 255 255/.15);padding-top:1.5rem;font-size:.8125rem;color:rgb(255 255 255/.55)}

/* Visor de fotos */
.lb{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgb(0 0 0/.94);cursor:zoom-out;animation:fade .4s var(--ease) both}
.lb .fr{width:min(92vw,86svh);cursor:default;animation:lbin .6s var(--ease) both}
@keyframes lbin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.lb .bar{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;animation:drop .6s var(--ease) .1s both}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.lb button{color:rgb(255 255 255/.7);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:.75rem 1rem;transition:color .3s,transform .4s var(--ease)}.lb button:hover{color:#fff}
.lb .nx,.lb .pv{position:absolute;top:50%;translate:0 -50%;font-size:22px;letter-spacing:0}.lb .pv{left:.75rem}.lb .nx{right:.75rem}
.lb .num{color:rgb(255 255 255/.6);font-size:12px;letter-spacing:.14em}

/* Aparición al hacer scroll (sin JS) */
@supports (animation-timeline:view()){.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 40%}}
@keyframes reveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Cambio de página: cortina de abajo hacia arriba */
::view-transition-old(root){animation:.6s cubic-bezier(.65,0,.35,1) both vtaway}
::view-transition-new(root){animation:.9s cubic-bezier(.16,1,.3,1) both vtreveal}
@keyframes vtaway{to{opacity:.4;transform:translateY(-4vh) scale(.985);filter:brightness(.6)}}
@keyframes vtreveal{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
::view-transition-group(site-header){animation:none}
::view-transition-old(site-header),::view-transition-new(site-header){animation:none;mix-blend-mode:normal}
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal}

/* Intro (una vez por visita) */
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;animation:gone 0s linear 3.5s forwards}
html[data-intro="off"] .intro{display:none}
@keyframes gone{to{visibility:hidden;pointer-events:none}}
.intro .half{position:absolute;left:0;right:0;height:50.2%;background:#000}
.intro .tp{top:0;animation:up .95s cubic-bezier(.76,0,.24,1) 2.55s forwards}.intro .bt{bottom:0;animation:dn .95s cubic-bezier(.76,0,.24,1) 2.55s forwards}
@keyframes up{to{transform:translateY(-100%)}}@keyframes dn{to{transform:translateY(100%)}}
.intro::before{content:"";position:absolute;left:50%;top:50%;height:1px;width:min(70vw,620px);background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%) scaleX(0);animation:line 1.1s cubic-bezier(.16,1,.3,1) .1s forwards}
@keyframes line{60%{opacity:.9}to{transform:translate(-50%,-50%) scaleX(1);opacity:0}}
.intro .lg{position:relative;width:min(52vw,320px);aspect-ratio:898/642;animation:focus 1.1s cubic-bezier(.16,1,.3,1) .55s both,ofade .45s ease 2.25s forwards}
.intro .lg img{position:absolute;inset:0;width:100%;height:100%}.intro .lg img:first-child{filter:brightness(.38)}
.intro .lg img.gl{animation:glint .9s cubic-bezier(.65,0,.35,1) 1.5s both}
@keyframes focus{from{opacity:0;filter:blur(16px);transform:scale(1.14)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes ofade{to{opacity:0;transform:scale(.98)}}
@keyframes glint{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.intro .bar{position:absolute;bottom:13vh;left:50%;width:min(60vw,340px);height:1px;background:rgb(255 255 255/.18);transform:translateX(-50%);animation:ofade .35s ease 2.2s forwards}
.intro .bar span{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0);animation:load 2.1s cubic-bezier(.45,.05,.25,1) .3s forwards}
@keyframes load{to{transform:scaleX(1)}}
.intro .cnt{position:absolute;bottom:calc(13vh + 14px);left:50%;width:min(60vw,340px);transform:translateX(-50%);color:rgb(255 255 255/.7);font:500 12px/1 Archivo,sans-serif;letter-spacing:.16em;text-align:right;counter-reset:n var(--n);animation:count 2.1s cubic-bezier(.45,.05,.25,1) .3s forwards,ofade .35s ease 2.2s forwards}
.intro .cnt::before{content:counter(n) " / 100"}
@keyframes count{to{--n:100}}
.intro .skip{position:absolute;right:1.25rem;bottom:1.25rem;padding:.5rem .75rem;color:rgb(255 255 255/.55);font-size:12px;letter-spacing:.14em;text-transform:uppercase;animation:fade .4s ease .4s both,ofade .35s ease 2.2s forwards}.intro .skip:hover{color:#fff}
noscript .intro{display:none}
</style>
</head>
<body>
<script>try{document.documentElement.dataset.intro=sessionStorage.getItem("kest-intro")?"off":"on"}catch(e){document.documentElement.dataset.intro="on"}</script>
<div class="intro" aria-hidden="true">
  <div class="half tp"></div><div class="half bt"></div>
  <div class="lg"><img src="brand/kest-logo-white.png" alt="" width="898" height="642"><img class="gl" src="brand/kest-logo-white.png" alt="" width="898" height="642"></div>
  <div class="bar"><span></span></div><span class="cnt"></span>
  <button type="button" class="skip" id="skip">Saltar</button>
</div>
<a href="#contenido" class="sr">Saltar al contenido</a>
<header class="top"><div class="wrap bar">
  <a class="logo" href="#/" aria-label="KEST, inicio"><img src="brand/kest-logo.png" alt="KEST" width="898" height="642"></a>
  <nav id="nav" aria-label="Principal"></nav>
  <form class="s" role="search" id="sf"><label class="sr" for="q1">Buscar productos</label><input id="q1" type="search" placeholder="Buscar productos" autocomplete="off"></form>
  <div class="right">
    <a class="cartlink" href="#/carrito" id="cl" aria-label="Carrito"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><b class="num" id="cc"></b></a>
    <details class="menu" id="menu"><summary aria-label="Menú"><i></i></summary>
      <div class="menu-panel"><form role="search" id="sf2"><label class="sr" for="q2">Buscar productos</label><input id="q2" type="search" placeholder="Buscar productos"></form><ul id="mnav"></ul></div>
    </details>
  </div>
</div></header>
<main id="contenido"><div id="app"></div></main>
<footer class="foot"><div class="wrap">
  <div class="cols">
    <div><img src="brand/kest-logo-white.png" alt="KEST" width="898" height="642" style="height:44px;width:auto"><p style="max-width:20rem;color:rgb(255 255 255/.65);margin:1rem 0 0">Objetos seleccionados por KEST para el día a día.</p></div>
    <div><h2>Tienda</h2><ul id="fcat"></ul></div>
    <div><h2>Ayuda</h2><ul><li><a class="link" href="#/contacto">Contacto</a></li><li><a class="link" href="#/politicas/cambios-y-devoluciones">Cambios y devoluciones</a></li></ul></div>
    <div><h2>Contacto</h2><ul id="fcon"></ul></div>
  </div>
  <p class="legal">© <span id="yr"></span> KEST. Precios en pesos chilenos (CLP), IVA incluido.</p>
</div></footer>
<noscript><p style="padding:2rem;text-align:center">Esta tienda necesita JavaScript para funcionar.</p></noscript>

<script>

DO SÍ HAY CAMBIO O DEVOLUCIÓN\n• El producto llega con falla de fabricación o no funciona correctamente.\n• El producto llega dañado o roto por el transporte.\n• Recibes un producto distinto al que pediste (modelo, color u opción equivocada).\n• Falta alguna pieza o accesorio que debía venir incluido.\n• Hubo un error nuestro en el pedido, el despacho o la información publicada del producto.\n\nCUÁNDO NO HAY CAMBIO NI DEVOLUCIÓN\n• Cambio de opinión, o porque el producto no te gustó o no era lo que esperabas, si coincide con lo publicado.\n• Elegiste mal el modelo, color u opción al comprar.\n• Daños por mal uso, golpes, caídas, humedad, líquidos o manipulación del producto.\n• Desgaste normal por el uso.\n• Productos sin su embalaje, accesorios o piezas originales, o con señales de uso que no corresponden a una falla.\n• Reclamos hechos fuera de los plazos de esta política.\n\nCÓMO SOLICITARLO\n1. Escríbenos desde la página de Contacto con tu número de pedido, una descripción del problema y fotos o un video donde se vea la falla o el daño. Si el producto llegó dañado, incluye también una foto del embalaje.\n2. Revisamos tu caso y te respondemos con la solución.\n3. Si corresponde, te enviamos un producto nuevo igual o te devolvemos el dinero. Cuando el error es nuestro o el producto llegó con falla, no pagas el despacho del cambio ni de la devolución.\n\nPLAZOS\n• Producto dañado, equivocado o incompleto: avísanos dentro de los 10 días corridos desde que lo recibes.\n• Falla de funcionamiento: puedes reclamar dentro del plazo de la garantía legal.\n• La devolución del dinero se hace por el mismo medio de pago que usaste.\n\nEsta política se entiende sin perjuicio de los derechos que la Ley N° 19.496 sobre Protección de los Derechos de los Consumidores te reconoce, como la garantía legal por productos con fallas."},"policyTitles":{"cambios-y-devoluciones":"Cambios y devoluciones"}};
const CFG = Object.assign({ whatsapp: "", email: "", instagram: "" }, window.KEST_CONFIG || {});
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clp = (n) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(n);
const byId = Object.fromEntries(DATA.products.map((p) => [p.id, p]));
const bySlug = Object.fromEntries(DATA.products.map((p) => [p.slug, p]));
const cat = (id) => DATA.categories.find((c) => c.id === id);

/* Carrito (se guarda en el navegador) */
const KEY = "kest-static-cart-v1";
let cart = [];
try { cart = JSON.parse(localStorage.getItem(KEY) || "[]").filter((l) => byId[l.id]); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch {} paintCount(); };
const count = () => cart.reduce((n, l) => n + l.qty, 0);
function paintCount(bump) {
  const c = count(), el = $("#cc");
  el.textContent = c || "";
  $("#cl").setAttribute("aria-label", `Carrito, ${c} productos`);
  if (bump) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}
function addToCart(id, qty, variant) {
  const k = JSON.stringify(variant), l = cart.find((x) => x.id === id && JSON.stringify(x.variant) === k);
  if (l) l.qty = Math.min(l.qty + qty, 20); else cart.push({ id, qty, variant });
  save(); paintCount(true);
}

/* Piezas de interfaz */
const img = (src, alt, sq, eager) => `<div class="pimg${sq ? " sq" : ""}">${src ? `<img src="${esc(src)}" alt="${esc(alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async">` : `<div class="ph" role="img" aria-label="${esc(alt)} (sin fotografía)">22</div>`}</div>`;
const onSale = (p) => p.compare && p.compare > p.price;
function tags(p) {
  const t = [];
  if (onSale(p)) t.push('<span class="tag solid">Oferta</span>');
  if (p.is_new) t.push('<span class="tag">Nuevo</span>');
  if (p.featured) t.push('<span class="tag">Destacado</span>');
  return t.length ? `<div class="tags">${t.join("")}</div>` : "";
}
const card = (p) => `<a class="card reveal" href="#/producto/${esc(p.slug)}"><div class="frame">${tags(p)}${img(p.images[0], p.name)}</div><h3>${esc(p.name)}</h3><p class="num"><span>${clp(p.price)}</span>${onSale(p) ? `<s class="mute">${clp(p.compare)}</s>` : ""}</p></a>`;
const row = (title, href, items) => items.length ? `<section class="wrap mt-l reveal"><div class="row"><h2 class="display">${title}</h2><a class="link" href="${href}" style="font-size:.875rem">Ver todo</a></div><div class="grid mt-s">${items.map(card).join("")}</div></section>` : "";

/* Páginas */
const views = {
  home() {
    const b = DATA.banner, feat = DATA.products.filter((p) => p.featured).slice(0, 4), news = [...DATA.products].sort((a, c) => c.created.localeCompare(a.created)).slice(0, 4);
    return `<section class="hero"><div class="wrap in"><span class="big num" aria-hidden="true">22</span>
      <h1 class="display rise">${esc(b.title)}</h1><p class="rise" style="--d:.12s">${esc(b.subtitle)}</p>
      <div class="cta rise" style="--d:.24s"><a class="btn light" href="#/catalogo">${esc(b.cta)}</a></div></div></section>
    <section class="wrap mt-m reveal"><h2 class="display">Categorías</h2><ul class="cats">${DATA.categories.map((c) => `<li><a href="#/catalogo?categoria=${esc(c.slug)}"><span>${esc(c.name)}</span><span>${DATA.products.filter((p) => p.cat === c.id).length} productos</span></a></li>`).join("")}</ul></section>
    ${row("Destacados", "#/catalogo", feat.length ? feat : DATA.products.slice(0, 4))}
    ${row("Nuevos lanzamientos", "#/catalogo?orden=recientes", news)}
    <section class="wrap mt-l two reveal"><h2 class="display" style="font-size:clamp(1.9rem,3.6vw,3rem)">Un universo creativo, tecnológico y comercial.</h2><div class="mute" style="font-size:1.125rem;align-self:end"><p style="margin:0">KEST reúne en un solo lugar los objetos que usamos, probamos y recomendamos. Pocos productos, bien elegidos, con información clara y un proceso de compra corto.</p></div></section>
    <section class="wrap mt-l reveal"><h2 class="sr">Beneficios de comprar en KEST</h2><div class="ben">
      <div><b>Despacho a todo Chile</b><p>Costos claros antes de enviar tu pedido.</p></div>
      <div><b>Precios finales</b><p>Todo en pesos chilenos, con IVA incluido.</p></div>
      <div><b>Cambios y devoluciones</b><p>Si llega con falla o por error nuestro, lo resolvemos.</p></div>
      <div><b>Atención directa</b><p>Coordinamos tu pedido por mensaje.</p></div></div></section>
    <section class="wrap mt-l reveal"><div class="cta-box"><h2 class="display">¿Dudas antes de comprar?</h2><div><a class="btn" href="#/contacto">Escríbenos</a></div></div></section>`;
  },
  catalogo(q) {
    const slug = q.get("categoria") || "", term = (q.get("q") || "").trim().toLowerCase(), ord = q.get("orden") || "";
    let list = DATA.products.filter((p) => (!slug || cat(p.cat)?.slug === slug) && (!term || (p.name + " " + p.description).toLowerCase().includes(term)));
    if (ord === "menor") list.sort((a, b) => a.price - b.price); else if (ord === "mayor") list.sort((a, b) => b.price - a.price);
    else if (ord === "recientes") list.sort((a, b) => b.created.localeCompare(a.created));
    const href = (o) => "#/catalogo" + (Object.keys(o).length ? "?" + new URLSearchParams(o) : "");
    const keep = (extra) => { const o = {}; if (term) o.q = term; if (ord) o.orden = ord; return Object.assign(o, extra); };
    return `<div class="wrap" style="padding-top:3rem"><h1 class="display">${term ? `Resultados para “${esc(term)}”` : slug ? esc(cat(DATA.categories.find((c) => c.slug === slug)?.id)?.name || "Catálogo") : "Catálogo"}</h1>
      <div class="filters"><a class="chip ${slug ? "" : "on"}" href="${href(keep({}))}">Todo</a>${DATA.categories.map((c) => `<a class="chip ${slug === c.slug ? "on" : ""}" href="${href(keep({ categoria: c.slug }))}">${esc(c.name)}</a>`).join("")}</div>
      <div class="tools"><span class="mute num">${list.length} producto${list.length === 1 ? "" : "s"}</span>
        <label>Ordenar <select id="ord"><option value="">Destacados</option><option value="recientes"${ord === "recientes" ? " selected" : ""}>Más recientes</option><option value="menor"${ord === "menor" ? " selected" : ""}>Precio: menor a mayor</option><option value="mayor"${ord === "mayor" ? " selected" : ""}>Precio: mayor a menor</option></select></label></div>
      ${list.length ? `<div class="grid mt-s">${list.map(card).join("")}</div>` : `<p class="empty">No encontramos productos con ese criterio.</p>`}</div>`;
  },
  producto(slug) {
    const p = bySlug[slug]; if (!p) return views.notfound();
    const rel = DATA.products.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4);
    return `<div class="wrap"><p class="crumbs"><a class="link" href="#/catalogo">Catálogo</a> / ${esc(cat(p.cat)?.name || "")}</p>
      <div class="pd"><div id="gal"></div>
        <div><h1 class="display" style="font-size:clamp(1.9rem,3.4vw,2.75rem)">${esc(p.name)}</h1>
          <p class="price num"><span>${clp(p.price)}</span>${onSale(p) ? `<s>${clp(p.compare)}</s>` : ""}</p>
          <p class="mute" style="margin:1rem 0 0;white-space:pre-line">${esc(p.description)}</p>
          ${p.variants.map((v, i) => `<fieldset class="opts" data-v="${esc(v.name)}"><legend>${esc(v.name)}<span class="sel"></span></legend><div class="o">${v.options.map((o) => `<button type="button" class="opt" aria-pressed="false" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div></fieldset>`).join("")}
          <div style="margin-top:1.5rem"><div class="qty" role="group" aria-label="Cantidad"><button type="button" id="mn" aria-label="Disminuir cantidad">−</button><output class="num" id="qv">1</output><button type="button" id="pl" aria-label="Aumentar cantidad">+</button></div></div>
          <div style="margin-top:1.5rem"><button class="btn block" id="add">Agregar al carrito</button></div>
          <p class="err fade" id="pe" role="alert" hidden></p><p class="fade" id="pk" role="status" hidden>Agregado al carrito. <a class="link" href="#/carrito" style="text-decoration:underline">Ver carrito</a></p>
          ${p.specs.length ? `<dl class="spec">${p.specs.map((s) => `<dt>${esc(s.label)}</dt><dd>${esc(s.value)}</dd>`).join("")}</dl>` : ""}
          <div class="note"><b style="color:#000;font-weight:500">Cambios y devoluciones.</b> Si llega con falla o por un error nuestro. <a class="link" href="#/politicas/cambios-y-devoluciones" style="text-decoration:underline">Ver política</a></div>
        </div></div></div>
      ${row("También te puede interesar", "#/catalogo", rel)}`;
  },
  carrito() {
    if (!cart.length) return `<div class="wrap" style="padding:3rem 0 0"><h1 class="display">Tu carrito</h1><p class="empty">Tu carrito está vacío.<br><br><a class="btn" href="#/catalogo">Ver catálogo</a></p></div>`;
    const sub = cart.reduce((n, l) => n + byId[l.id].price * l.qty, 0);
    const reg = sessionStorage.getItem("kest-reg") || "rm", ship = reg === "rm" ? DATA.shipping.rm : DATA.shipping.other;
    return `<div class="wrap" style="padding-top:3rem"><h1 class="display">Tu carrito</h1><div class="cart mt-s"><div>
      ${cart.map((l, i) => { const p = byId[l.id], v = Object.entries(l.variant || {}).map(([k, x]) => `${esc(k)}: ${esc(x)}`).join(" · ");
        return `<div class="line"><a href="#/producto/${esc(p.slug)}">${img(p.images[0], p.name, true)}</a><div><h3><a class="link" href="#/producto/${esc(p.slug)}">${esc(p.name)}</a></h3>${v ? `<small>${v}</small><br>` : ""}<span class="num">${clp(p.price)}</span>
          <div style="margin-top:.6rem;display:flex;gap:1rem;align-items:center"><div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="Disminuir">−</button><output class="num">${l.qty}</output><button type="button" data-q="${i}" data-d="1" aria-label="Aumentar">+</button></div><button type="button" class="rm" data-r="${i}">Quitar</button></div></div><b class="num" style="font-weight:500">${clp(p.price * l.qty)}</b></div>`; }).join("")}
      </div>
      <form class="sum" id="co" novalidate><h2 style="margin:0;font-size:1.125rem;font-weight:600">Datos del pedido</h2>
        <div class="fld"><label for="nm">Nombre y apellido</label><input id="nm" autocomplete="name" required></div>
        <div class="fld"><label for="tl">Teléfono</label><input id="tl" type="tel" autocomplete="tel" placeholder="+56 9 ..." required></div>
        <div class="fld"><label for="rg">Zona de despacho</label><select id="rg"><option value="rm"${reg === "rm" ? " selected" : ""}>Región Metropolitana (${clp(DATA.shipping.rm)})</option><option value="otras"${reg === "otras" ? " selected" : ""}>Otras regiones (${clp(DATA.shipping.other)})</option></select></div>
        <div class="fld"><label for="ad">Dirección, comuna y región</label><input id="ad" autocomplete="street-address" required></div>
        <div class="t"><span>Subtotal</span><span class="num">${clp(sub)}</span></div><div class="t"><span>Despacho</span><span class="num">${clp(ship)}</span></div>
        <div class="t tot"><span>Total</span><span class="num">${clp(sub + ship)}</span></div>
        <p class="err" id="ce" role="alert" hidden></p>
        <button class="btn block" type="submit">${CFG.whatsapp ? "Enviar pedido por WhatsApp" : "Copiar mi pedido"}</button>
        <p class="mute" style="margin:0;font-size:.8125rem">${CFG.whatsapp ? "Se abre WhatsApp con tu pedido listo. El pago y la entrega se coordinan por ahí al confirmar." : "Copia el pedido y envíalo por el canal de contacto de KEST. El pago y la entrega se coordinan al confirmar."}</p>
        <p class="fade" id="cok" role="status" hidden>Pedido copiado.</p></form></div></div>`;
  },
  contacto() {
    const faq = [["¿Cómo compro?", "Agrega productos al carrito, completa tus datos y envía el pedido. Lo confirmamos contigo y coordinamos el pago y la entrega."], ["¿Puedo cambiar o devolver un producto?", "Sí, si el producto llega con falla, dañado, equivocado o por un error nuestro. Por otros motivos no hacemos cambios ni devoluciones. Lee la política completa."], ["¿Cuánto cuesta el despacho?", `Región Metropolitana ${clp(DATA.shipping.rm)}; otras regiones ${clp(DATA.shipping.other)}.`]];
    const ch = []; if (CFG.whatsapp) ch.push(`<a class="btn" href="https://wa.me/${esc(CFG.whatsapp)}" target="_blank" rel="noopener">Escribir por WhatsApp</a>`);
    if (CFG.email) ch.push(`<a class="btn ghost" href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a>`);
    return `<div class="wrap" style="padding-top:3rem"><h1 class="display">Contacto</h1><div class="two mt-s"><div>${ch.length ? `<p class="mute" style="margin:0 0 1.5rem;max-width:28rem">Escríbenos y te respondemos a la brevedad.</p><div style="display:flex;gap:.75rem;flex-wrap:wrap">${ch.join("")}</div>` : `<p class="mute">Pronto publicaremos nuestros canales de contacto.</p>`}</div>
      <div>${faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div></div></div>`;
  },
  politicas(slug) {
    const t = DATA.policies[slug]; if (!t) return views.notfound();
    return `<div class="wrap doc" style="padding-top:3rem"><h1 class="display">${esc(DATA.policyTitles[slug])}</h1><div style="margin-top:2.5rem">${t.split("\n").map((l) => /^[A-ZÁÉÍÓÚÑ ]{4,}$/.test(l) ? `<h2 class="reveal">${esc(l)}</h2>` : l.trim() ? `<p>${esc(l)}</p>` : '<div style="height:.75rem"></div>').join("")}</div></div>`;
  },
  notfound() { return `<div class="wrap" style="padding:5rem 0;text-align:center"><h1 class="display">Página no encontrada</h1><p class="mute">Lo que buscas no existe o cambió de lugar.</p><a class="btn" href="#/">Volver al inicio</a></div>`; },
};

/* Comportamiento de cada página tras dibujarla */
function wire(route, q) {
  const app = $("#app");
  if (route === "catalogo") $("#ord").onchange = (e) => { const p = new URLSearchParams(location.hash.split("?")[1] || ""); e.target.value ? p.set("orden", e.target.value) : p.delete("orden"); location.hash = "#/catalogo" + (p.toString() ? "?" + p : ""); };
  if (route === "producto") {
    const p = bySlug[q]; if (!p) return;
    let i = 0, qty = 1; const sel = {};
    const gal = $("#gal");
    const paintGal = () => { gal.innerHTML = `<button class="zoom" aria-label="Ampliar foto"><div class="fade" key="${i}">${img(p.images[i], `${p.name}, foto ${i + 1}`, true, true)}</div></button>${p.images.length > 1 ? `<ul class="thumbs">${p.images.map((s, n) => `<li><button class="${n === i ? "on" : ""}" data-n="${n}" aria-label="Ver foto ${n + 1}">${img(s, "", true)}</button></li>`).join("")}</ul>` : ""}`;
      gal.querySelector(".zoom").onclick = () => lightbox(p, i, (n) => { i = n; paintGal(); });
      gal.querySelectorAll("[data-n]").forEach((b) => (b.onclick = () => { i = +b.dataset.n; paintGal(); })); };
    paintGal();
    app.querySelectorAll(".opts").forEach((f) => f.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { sel[f.dataset.v] = b.dataset.o; f.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-pressed", x === b)); f.querySelector(".sel").textContent = ": " + b.dataset.o; $("#pe").hidden = true; $("#pk").hidden = true; })));
    $("#mn").onclick = () => { qty = Math.max(1, qty - 1); $("#qv").textContent = qty; };
    $("#pl").onclick = () => { qty = Math.min(20, qty + 1); $("#qv").textContent = qty; };
    $("#add").onclick = () => {
      const miss = p.variants.find((v) => !sel[v.name]);
      if (miss) { $("#pe").textContent = `Elige ${miss.name.toLowerCase()} antes de agregar.`; $("#pe").hidden = false; return; }
      $("#pe").hidden = true; addToCart(p.id, qty, { ...sel }); $("#pk").hidden = false; $("#add").textContent = "Agregado ✓";
    };
  }
  if (route === "carrito" && cart.length) {
    app.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => { const l = cart[+b.dataset.q]; l.qty = Math.min(20, Math.max(1, l.qty + +b.dataset.d)); save(); render(true); }));
    app.querySelectorAll("[data-r]").forEach((b) => (b.onclick = () => { cart.splice(+b.dataset.r, 1); save(); render(true); }));
    $("#rg").onchange = (e) => { sessionStorage.setItem("kest-reg", e.target.value); render(true); };
    $("#co").onsubmit = async (e) => {
      e.preventDefault();
      const v = (id) => $(id).value.trim(), err = $("#ce");
      if (!v("#nm") || !v("#tl") || !v("#ad")) { err.textContent = "Completa nombre, teléfono y dirección."; err.hidden = false; return; }
      err.hidden = true;
      const sub = cart.reduce((n, l) => n + byId[l.id].price * l.qty, 0), ship = $("#rg").value === "rm" ? DATA.shipping.rm : DATA.shipping.other;
      const lines = cart.map((l) => { const p = byId[l.id], vv = Object.entries(l.variant || {}).map(([k, x]) => `${k}: ${x}`).join(", "); return `• ${l.qty} x ${p.name}${vv ? ` (${vv})` : ""} — ${clp(p.price * l.qty)}`; });
      const msg = `Hola KEST, quiero hacer este pedido:\n\n${lines.join("\n")}\n\nSubtotal: ${clp(sub)}\nDespacho: ${clp(ship)}\nTotal: ${clp(sub + ship)}\n\nNombre: ${v("#nm")}\nTeléfono: ${v("#tl")}\nDirección: ${v("#ad")}`;
      if (CFG.whatsapp) window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
      else { try { await navigator.clipboard.writeText(msg); } catch { prompt("Copia tu pedido:", msg); } $("#cok").hidden = false; }
    };
  }
}

function lightbox(p, start, onClose) {
  let i = start; const d = document.createElement("div"); d.className = "lb"; d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", `Fotos de ${p.name}`);
  const many = p.images.length > 1, prev = document.body.style.overflow; document.body.style.overflow = "hidden";
  const paint = () => { d.innerHTML = `<div class="bar"><span class="num">${many ? `${i + 1} / ${p.images.length}` : esc(p.name)}</span><button type="button" data-x>Cerrar</button></div><div class="fr"><div class="fade">${img(p.images[i], `${p.name}, foto ${i + 1}`, true, true)}</div></div>${many ? '<button type="button" class="pv" data-p aria-label="Foto anterior">←</button><button type="button" class="nx" data-n aria-label="Foto siguiente">→</button>' : ""}`; d.querySelector("[data-x]").focus(); };
  const close = () => { document.removeEventListener("keydown", key); document.body.style.overflow = prev; d.remove(); onClose(i); };
  const go = (n) => { i = (n + p.images.length) % p.images.length; paint(); };
  const key = (e) => { if (e.key === "Escape") close(); else if (many && e.key === "ArrowRight") go(i + 1); else if (many && e.key === "ArrowLeft") go(i - 1); };
  d.onclick = (e) => { if (e.target.closest("[data-x]") || e.target === d) close(); else if (e.target.closest("[data-p]")) go(i - 1); else if (e.target.closest("[data-n]")) go(i + 1); };
  document.addEventListener("keydown", key); document.body.append(d); paint();
}

/* Router por hash */
function render(soft) {
  const [path, qs] = (location.hash.slice(1) || "/").split("?"), parts = path.split("/").filter(Boolean), q = new URLSearchParams(qs || "");
  const route = parts[0] || "home", arg = route === "producto" || route === "politicas" ? decodeURIComponent(parts[1] || "") : q;
  const known = views[route] && route !== "notfound";
  const html = known ? views[route](arg) : views.notfound();
  $("#app").innerHTML = html; if (known) wire(route, arg);
  const p = route === "producto" ? bySlug[arg] : null;
  document.title = p ? `${p.name} — KEST` : { catalogo: "Catálogo — KEST", carrito: "Carrito — KEST", contacto: "Contacto — KEST", politicas: `${DATA.policyTitles[arg] || "Política"} — KEST` }[route] || "KEST — Tienda oficial";
  if (!soft) window.scrollTo(0, 0);
  $("#menu").open = false;
}
function go() { document.startViewTransition ? document.startViewTransition(() => render()) : render(); }

/* Arranque */
const navItems = [["#/catalogo", "Catálogo"], ...DATA.categories.slice(0, 3).map((c) => [`#/catalogo?categoria=${c.slug}`, c.name]), ["#/contacto", "Contacto"]];
$("#nav").innerHTML = navItems.map(([h, t]) => `<a class="link" href="${h}">${esc(t)}</a>`).join("");
$("#mnav").innerHTML = navItems.map(([h, t]) => `<li><a href="${h}">${esc(t)}</a></li>`).join("");
$("#fcat").innerHTML = DATA.categories.map((c) => `<li><a class="link" href="#/catalogo?categoria=${esc(c.slug)}">${esc(c.name)}</a></li>`).join("");
$("#fcon").innerHTML = [CFG.whatsapp && `<li><a class="link" href="https://wa.me/${esc(CFG.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a></li>`, CFG.email && `<li><a class="link" href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a></li>`, CFG.instagram && `<li><a class="link" href="${esc(CFG.instagram)}" target="_blank" rel="noopener">Instagram</a></li>`].filter(Boolean).join("") || '<li style="color:rgb(255 255 255/.55)">Próximamente</li>';
$("#yr").textContent = new Date().getFullYear();
for (const id of ["sf", "sf2"]) $("#" + id).onsubmit = (e) => { e.preventDefault(); const t = e.target.querySelector("input").value.trim(); location.hash = "#/catalogo" + (t ? "?q=" + encodeURIComponent(t) : ""); e.target.reset(); };
addEventListener("hashchange", go);
paintCount(); render();

/* Intro: una vez por visita; se apaga sola o con Esc / Saltar */
(() => {
  const off = () => { document.documentElement.dataset.intro = "off"; };
  try { sessionStorage.setItem("kest-intro", "1"); } catch {}
  setTimeout(off, 3700); $("#skip").onclick = off;
  addEventListener("keydown", (e) => { if (e.key === "Escape") off(); });
})();
</script>
